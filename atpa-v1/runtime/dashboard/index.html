<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agentic AI Operator System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">IntelligenzaArtificialeItalia.net</div>
    <h1>Agentic AI<br>Operator System</h1>
    <p>Procedure, prestazioni ed esperienza operativa in un unico catalogo locale.</p>
  </header>
  <main class="wrap">
    <section id="system" class="status"></section>
    <section id="stats" class="stats"></section>
    <div class="toolbar">
      <input id="q" placeholder="Cerca procedura o ruolo">
      <select id="department"><option value="">Tutti i reparti</option></select>
      <select id="status"><option value="">Tutti gli stati</option><option>draft</option><option>validated</option><option>active</option></select>
    </div>
    <section id="grid" class="grid"></section>
    <footer>Agentic AI Operator System · Alessandro Ciciarelli · Intelligenza Artificiale Italia</footer>
  </main>
  <dialog id="detail">
    <div class="detail">
      <button id="close-detail" class="close">Chiudi</button>
      <div id="detailBody"></div>
    </div>
  </dialog>
  <script src="data.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
