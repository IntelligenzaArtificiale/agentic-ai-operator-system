name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build package and manifest
        shell: pwsh
        run: ./Build-SystemRelease.ps1 -Version '${{ inputs.version }}'
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version='${{ inputs.version }}'
          $zip="release/Agentic-AI-Operator-System-$version-Windows-x64.zip"
          gh release create "v$version" $zip release-manifest.json --title "Agentic AI Operator System $version" --generate-notes
